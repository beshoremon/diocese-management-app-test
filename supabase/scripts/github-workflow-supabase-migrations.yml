# =====================================================================
# Supabase migrations — automatic deploy
#
# >>> INSTALL: this file belongs in .github/workflows/.  It is parked here
# >>> because the bot that opened the PR has no `workflows` permission.
# >>> After merging run (once):
# >>>   git mv supabase/scripts/github-workflow-supabase-migrations.yml \
# >>>          .github/workflows/supabase-migrations.yml
# >>>   git commit -m "ci: enable supabase migrations workflow" && git push
#
#   Pull request → main : validate file names + DRY RUN against production
#                         (shows exactly which files WOULD be applied)
#   Push to main        : `supabase db push` → applies only the pending
#                         files in supabase/migrations/ to production
#
# Required repository secrets  (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token  (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    project ref, the 20-char id in the dashboard URL
#   SUPABASE_DB_PASSWORD   database password      (Project Settings → Database)
#
# Before the FIRST run on an existing database run
#   supabase/scripts/baseline_migration_history.sql   once in the SQL editor,
# otherwise the CLI will try to re-apply 0001 … 0051 (and 0002 would create a
# second owner "000000" next to your real one).
#
# One-time: the "production" environment (Settings → Environments) can require
# a manual approval before the deploy job runs.
# =====================================================================
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# never run two pushes against the same database at the same time
concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # 1. Lint: every file in supabase/migrations/ must be a real migration
  # -------------------------------------------------------------------
  validate:
    name: Validate migration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: File names must match <version>_<name>.sql
        run: bash supabase/scripts/check_migration_names.sh

      - name: New migrations must be timestamped and newer than the latest applied
        if: github.event_name == 'pull_request'
        run: |
          bash supabase/scripts/check_migration_names.sh --new-since "origin/${{ github.base_ref }}"

  # -------------------------------------------------------------------
  # 2. Pull request: dry run against production (read-only)
  # -------------------------------------------------------------------
  dry-run:
    name: Dry run against production
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show remote vs local migration history
        run: supabase migration list --linked

      - name: Dry run
        run: supabase db push --linked --dry-run

  # -------------------------------------------------------------------
  # 3. main: deploy
  # -------------------------------------------------------------------
  deploy:
    name: Apply migrations to production
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migration history before
        run: supabase migration list --linked

      - name: Push pending migrations
        # --yes: no interactive confirmation in CI
        run: supabase db push --linked --yes

      - name: Migration history after
        if: always()
        run: supabase migration list --linked
